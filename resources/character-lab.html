<style>
/* Layout: grid-paper stage on the left, a scrolling "build sheet" panel on the right; stacks on phones */
:root {
  --paper: #f2f5f9; --grid: #dde6f1; --panel: #ffffff; --ink: #1c2130; --muted: #6a7386;
  --line: #e2e7ef; --chip: #f1f4f8; --accent: #d9466a; --accent-ink: #ffffff; --warn: #b35a00;
  --pixel: "Silkscreen", ui-monospace, monospace;
  --ui: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14161c; --grid: #20242e; --panel: #1b1e26; --ink: #eef1f6; --muted: #98a1b3;
  --line: #2b303c; --chip: #242833; --accent: #ff7a98; --accent-ink: #1b0d08; --warn: #ffb35a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #14161c; --grid: #20242e; --panel: #1b1e26; --ink: #eef1f6; --muted: #98a1b3;
  --line: #2b303c; --chip: #242833; --accent: #ff7a98; --accent-ink: #1b0d08; --warn: #ffb35a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: 100%; }
.stage { position: relative; min-width: 0; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px; }
#canvas { position: absolute; inset: 0; }
.stage-top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.stage-top > * { pointer-events: auto; }
h1 { font: 400 clamp(18px, 2.4vw, 24px)/1.1 var(--pixel); margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.stage-bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px;
  align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(20, 24, 36, .08); }
.stage-bar label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); padding: 0 6px; }
.stage-bar input[type=range] { width: 80px; accent-color: var(--accent); }
.stage-bar output { font: 500 12px var(--mono); color: var(--ink); min-width: 3.4em; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 16px; bottom: 76px; font-size: 12px; color: var(--muted); }

.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 16px 40px; padding-inline: 18px; min-width: 0; }
.panel section { padding-block: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel section:last-child { border-bottom: 0; }
.panel h2 { font: 400 11px var(--pixel); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: start; }
.row > .lbl { font-size: 12.5px; color: var(--muted); padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
button { font: 500 12.5px var(--ui); color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 8px;
  padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--line); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-strong { background: var(--ink); color: var(--panel); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 24px; height: 24px; border-radius: 6px; padding: 0; border: 2px solid var(--line); }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--panel) inset; background-clip: padding-box; }
input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.colorline { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.presets button { text-align: left; }
.accgroup { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.acc-active { display: grid; gap: 6px; }
.acc-active .item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; background: var(--chip); border-radius: 8px; padding: 4px 6px 4px 10px; }
.acc-active .item span { flex: 1; min-width: 0; }
.acc-active .item .side { padding: 3px 8px; }
.warn { color: var(--warn); font-size: 12px; }
textarea { width: 100%; box-sizing: border-box; min-height: 160px; resize: vertical; font: 12px/1.5 var(--mono); color: var(--ink);
  background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.toggle input { accent-color: var(--accent); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .stage { height: 62vh; min-height: 380px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-inline: 16px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const BlockyNS = (() => {
// ---- blocky-character.js
// BlockyCharacter — mix-and-match voxel-style characters for three.js
// --------------------------------------------------------------------
//   import * as THREE from 'three';
//   import { BlockyCharacter, PRESETS } from './blocky-character.js';
//
//   const hero = new BlockyCharacter(THREE, { body: 'female', hair: { style: 'bun', color: '#2b1b14' },
//                                            top: { style: 'hoodie', color: '#4e7bd8' },
//                                            accessories: ['headphones', 'phone'] });
//   scene.add(hero.root);
//   hero.play('Walk');                 // 'Walk' | 'Idle' | 'Ride' (see hero.clipNames)
//   // every frame: hero.update(delta)
//
//   hero.set({ top: { style: 'jacket' } });    // rebuilds in place, keeps position & animation
//   new BlockyCharacter(THREE, PRESETS.skater);
//
// All sizes are in "pixels" (px). Default px = 0.056 → an average adult is ~1.8 units tall.
// Characters face +Z with feet on y = 0.

// ---------------------------------------------------------------- palettes
const SKIN_TONES = {
  porcelain: '#ffe0cc', fair: '#f6c9a6', light: '#eab38c', medium: '#d39b72',
  olive: '#c08a5c', tan: '#a8704a', brown: '#87573a', dark: '#653f29', deep: '#46291b',
};
const HAIR_COLORS = {
  black: '#1f1a18', darkBrown: '#3b2519', brown: '#5e3b24', auburn: '#8a3a22', ginger: '#b8402b',
  blonde: '#d9b25f', platinum: '#ece0c0', grey: '#9a9a9a', white: '#eeeeee',
  pink: '#e86fa3', blue: '#4a7fe0', green: '#3fae6c', purple: '#8a5ad8',
};
const EYE_COLORS = { brown: '#3b2416', dark: '#1d1411', hazel: '#6b5a2e', green: '#3f7a4a', blue: '#3e6fb0', grey: '#6d7b86' };

// ---------------------------------------------------------------- body shapes
const BUILDS = {
  skinny:  { tw: 7,  td: 3.5, legW: 3.5, armDelta: -0.5 },
  average: { tw: 8,  td: 4,   legW: 4,   armDelta: 0 },
  chubby:  { tw: 10, td: 5.5, legW: 4.5, armDelta: 0.5 },
};
const HEIGHTS = {
  short:   { th: 10, legL: 11 },
  average: { th: 12, legL: 12 },
  tall:    { th: 13, legL: 14.5 },
};

// ---------------------------------------------------------------- defaults
const DEFAULT_MALE = {
  name: 'Default Male', body: 'male', build: 'average', height: 'average',
  skin: SKIN_TONES.light, eyes: EYE_COLORS.brown, freckles: false,
  hair: { style: 'short', color: HAIR_COLORS.brown },
  facialHair: { style: 'none' },
  top: { style: 'tshirt', color: '#4f86d9' },
  bottom: { style: 'pants', color: '#3b4357' },
  shoes: { style: 'simple', color: '#2d2a2a' },
  accessories: [],
};
const DEFAULT_FEMALE = {
  ...DEFAULT_MALE, name: 'Default Female', body: 'female',
  hair: { style: 'long', color: HAIR_COLORS.brown },
};

// ---------------------------------------------------------------- color helpers
function toColorNum(THREE, c, fallback = 0xff00ff) {
  if (c === undefined || c === null) return fallback;
  if (typeof c === 'number') return c;
  const named = SKIN_TONES[c] || HAIR_COLORS[c] || EYE_COLORS[c];
  return new THREE.Color(named || c).getHex();
}
function shade(THREE, c, f) {
  const col = new THREE.Color(c);
  if (f < 1) col.multiplyScalar(f);
  else col.lerp(new THREE.Color(0xffffff), f - 1);
  return col.getHex();
}
function mix(THREE, a, b, t) { return new THREE.Color(a).lerp(new THREE.Color(b), t).getHex(); }

// ---------------------------------------------------------------- registries
// Every part gets a context `k` with: box(), joint(), nodes, d (body dims), cfg, color helpers.
// Add your own entries to these objects (or use BlockyCharacter.register*) to extend the library.

const HAIR_STYLES = {
  none: () => {},
  buzz: (k, c) => {
    k.box(k.n.head, 8.3, 0.8, 8.3, 0, 8.25, 0, c);
    k.box(k.n.head, 8.3, 3.5, 0.5, 0, 6.5, -4.05, c);
  },
  short: (k, c) => shortBase(k, c),
  quiff: (k, c) => {
    shortBase(k, c);
    if (k.flags.hat) return;
    k.box(k.n.head, 6, 1.5, 4, 0.5, 9.5, 1.5, c);
    k.box(k.n.head, 4, 1, 2.8, 1, 10.5, 1.9, k.shade(c, 0.78));
  },
  spiky: (k, c) => {
    shortBase(k, c);
    if (k.flags.hat) return;
    [[-2.5, 1.5], [0, 2.2], [2.5, 1.2], [-1.2, -1.5], [1.5, -1.8]].forEach(([x, z], i) =>
      k.box(k.n.head, 1.6, 1.6 + (i % 2) * 0.6, 1.6, x, 9.6 + (i % 2) * 0.3, z, i % 2 ? k.shade(c, 0.85) : c));
  },
  afro: (k, c) => {
    if (k.flags.hat) return shortBase(k, c);
    k.box(k.n.head, 10, 4.5, 10, 0, 9.25, -0.5, c);
    k.box(k.n.head, 10, 5, 6, 0, 5, -2.5, c);
  },
  long: (k, c) => {
    shortBase(k, c);
    for (const s of [1, -1]) k.box(k.n.head, 1, 8.5, 5.5, 4.4 * s, 4.25, -1.75, c);
    k.box(k.n.head, 8.6, 8, 1.2, 0, 4.5, -4.65, c);
    k.box(k.n.head, 8, 4, 1, 0, -1.5, -(k.d.td / 2 + 0.6), k.shade(c, 0.92));
  },
  bob: (k, c) => {
    shortBase(k, c);
    for (const s of [1, -1]) k.box(k.n.head, 1, 6, 7, 4.4 * s, 5, -0.5, c);
    k.box(k.n.head, 8.8, 6, 1, 0, 5, -4.4, c);
  },
  ponytail: (k, c) => {
    shortBase(k, c);
    k.box(k.n.head, 2.2, 1.2, 1.4, 0, 6.5, -5.2, k.shade(c, 0.7));
    k.box(k.n.head, 2, 6, 1.6, 0, 3, -5.5, c);
  },
  bun: (k, c) => {
    shortBase(k, c);
    if (k.flags.hat) return;
    k.box(k.n.head, 4, 3, 4, 0, 10.4, -1.5, c);
    k.box(k.n.head, 4.3, 0.6, 4.3, 0, 9.2, -1.5, k.shade(c, 0.7));
  },
  pigtails: (k, c) => {
    shortBase(k, c);
    for (const s of [1, -1]) {
      k.box(k.n.head, 1.6, 5, 1.6, 5.2 * s, 3.5, -1.5, c);
      k.box(k.n.head, 1.9, 0.6, 1.9, 5.2 * s, 6.2, -1.5, k.shade(c, 0.7));
    }
  },
  mohawk: (k, c) => {
    k.box(k.n.head, 8.2, 0.4, 8.2, 0, 8.6, 0, k.mix(c, k.skin, 0.55));
    if (k.flags.hat) return;
    k.box(k.n.head, 2, 3, 8.6, 0, 10.3, 0, c);
  },
};
function shortBase(k, c) {
  const h = k.n.head;
  k.box(h, 8.5, 1.5, 8.5, 0, 8.25, 0, c);
  k.box(h, 8.4, 4.8, 1, 0, 5.9, -4.1, c);
  for (const s of [1, -1]) k.box(h, 1, 3.5, 4.5, 3.65 * s, 6.25, -1.9, c);
  k.box(h, 8.5, 1, 1, 0, 7.5, 3.8, c);
}

const FACIAL_HAIR = {
  none: () => {},
  stubble: (k, c) => {
    const col = k.mix(c, k.skin, 0.5);
    k.box(k.n.head, 7, 2.5, 0.2, 0, 1.85, 4.1, col);
    for (const s of [1, -1]) k.box(k.n.head, 0.2, 2.5, 4, 4.1 * s, 1.85, 1.5, col);
  },
  moustache: (k, c) => k.box(k.n.head, 4, 0.7, 0.35, 0, 3.95, 4.15, c),
  goatee: (k, c) => {
    k.box(k.n.head, 4, 0.7, 0.35, 0, 3.95, 4.15, c);
    k.box(k.n.head, 2.5, 2.5, 0.35, 0, 1.9, 4.15, c);
  },
  beard: (k, c) => {
    k.box(k.n.head, 8.5, 3.25, 8.5, 0, 1.875, 0, c);
    k.box(k.n.head, 4, 1, 1, 0, 1.1, 4.2, k.shade(c, 0.78));
    k.box(k.n.head, 4, 0.6, 0.3, 0, 3.9, 4.15, c);
  },
};

// tops: torso + sleeves. `long` sleeves end in a cuff, `short` stop at the bicep.
function torso(k, c) { return k.box(k.n.spine, k.d.tw, k.d.th, k.d.td, 0, k.d.th / 2, 0, c); }
function sleeves(k, len, c, cuff) {
  const { armW: w, armTop, handTop } = k.d;
  for (const arm of [k.n.armL, k.n.armR]) {
    if (len === 'long') {
      const h = armTop + 0.15 - handTop;
      k.box(arm, w + 0.3, h, w + 0.3, 0, armTop + 0.15 - h / 2, 0, c);
      k.box(arm, w + 0.5, 1.05, w + 0.5, 0, handTop + 0.45, 0, cuff ?? c);
    } else if (len === 'short') {
      k.box(arm, w + 0.3, 4.65, w + 0.3, 0, armTop + 0.15 - 2.325, 0, c);
    }
  }
}
const front = (k) => k.d.td / 2 + 0.1;
// finger blocks: each entry is [x, y, z, w, h, d] in the hand item's space
function grip(k, item, ...fingers) {
  const col = k.shade(k.skin, 0.95);
  for (const [x, y, z, w, h, d] of fingers) k.box(item, w, h, d, x, y, z, col);
}

const TOPS = {
  tshirt: (k, c, a) => {
    torso(k, c); sleeves(k, 'short', c);
    k.box(k.n.spine, 3, 0.6, 0.2, 0, k.d.th - 0.4, front(k), k.shade(c, 0.8));
  },
  polo: (k, c, a) => {
    torso(k, c); sleeves(k, 'short', c);
    k.box(k.n.spine, 4, 0.9, 0.25, 0, k.d.th - 0.45, front(k), a ?? k.shade(c, 1.35));
    k.box(k.n.spine, 0.8, 3, 0.2, 0, k.d.th - 1.8, front(k), k.shade(c, 0.8));
  },
  longsleeve: (k, c) => { torso(k, c); sleeves(k, 'long', c, k.shade(c, 0.88)); },
  tanktop: (k, c) => {
    torso(k, c);
    k.box(k.n.spine, 3, 1.5, 0.2, 0, k.d.th - 0.75, front(k), k.skin);
  },
  hoodie: (k, c, a) => {
    torso(k, c); sleeves(k, 'long', c, k.shade(c, 0.85));
    const { th, td, tw } = k.d;
    k.box(k.n.spine, Math.min(7, tw - 1), 4.5, 1.4, 0, th, -(td / 2 + 2.1), k.shade(c, 0.9)); // hood
    k.box(k.n.spine, tw - 2, 2.5, 0.25, 0, 3, front(k), k.shade(c, 0.85));                    // pocket
    for (const s of [1, -1]) k.box(k.n.spine, 0.4, 2.5, 0.25, s, th - 2.5, front(k) + 0.02, a ?? 0xf2f2f2);
    k.box(k.n.spine, tw + 0.2, 1.2, td + 0.35, 0, 0.55, 0, k.shade(c, 0.85));                  // waistband
  },
  jacket: (k, c, a) => {
    torso(k, c); sleeves(k, 'long', c, a ?? 0xfff6ea);
    const { th, td, tw } = k.d, z = front(k);
    k.box(k.n.spine, 2.4, th - 0.5, 0.2, 0, th / 2 + 0.25, z, a ?? 0xfff6ea);                 // shirt
    for (const s of [1, -1]) k.box(k.n.spine, 0.5, th - 2, 0.25, 1.45 * s, th / 2 + 0.5, z + 0.02, k.shade(c, 0.78));
    k.box(k.n.spine, tw + 0.1, 3, td + 0.35, 0, 1.45, 0, c);                                      // hem
    k.box(k.n.spine, 2, 1, 0.3, -(tw / 4 + 0.5), 3.5, td / 2 + 0.25, k.shade(c, 0.78));      // pocket flap
  },
  sweater: (k, c, a) => {
    torso(k, c); sleeves(k, 'long', c, k.shade(c, 0.85));
    const { th, td, tw } = k.d;
    k.box(k.n.spine, tw + 0.2, 1.2, td + 0.35, 0, 0.55, 0, k.shade(c, 0.85));
    k.box(k.n.spine, tw + 0.2, 1.2, td + 0.35, 0, th * 0.58, 0, a ?? k.shade(c, 1.4));
  },
  dress: (k, c, a) => {
    torso(k, c); sleeves(k, 'short', c);
    const { tw, td } = k.d;
    k.box(k.n.hips, tw + 1, 5.5, td + 1.2, 0, -2.25, 0, c);
    k.box(k.n.hips, tw + 1.6, 2.5, td + 1.8, 0, -4.25, 0, c);
    k.box(k.n.spine, tw + 0.2, 0.8, td + 0.35, 0, 0.9, 0, a ?? k.shade(c, 0.75));
  },
};
TOPS.dress.coversLegs = true;

const BOTTOMS = {
  bare: () => {},
  pants: (k, c) => legs(k, (leg) => k.box(leg, k.d.legW + 0.2, k.d.legL - 2.4, k.d.legW + 0.2, 0, -(k.d.legL - 2.4) / 2, 0, c)),
  widePants: (k, c) => legs(k, (leg) => {
    const L = k.d.legL - 2.4, w = k.d.legW + 0.2;
    k.box(leg, w, L, w, 0, -L / 2, 0, c);
    k.box(leg, w + 0.05, 1, w + 0.05, 0, -L + 0.5, 0, k.shade(c, 0.75));
  }),
  jeans: (k, c) => {
    legs(k, (leg) => {
      const L = k.d.legL - 2.4, w = k.d.legW + 0.2;
      k.box(leg, w, L, w, 0, -L / 2, 0, c);
      k.box(leg, w + 0.15, 1, w + 0.15, 0, -L + 0.4, 0, k.shade(c, 1.25));
    });
    k.box(k.n.spine, k.d.tw + 0.14, 0.8, k.d.td + 0.25, 0, 0.38, 0, 0x3b2a20);
    k.box(k.n.spine, 1.2, 0.6, 0.2, 0, 0.4, k.d.td / 2 + 0.2, 0xd9b25f);
  },
  joggers: (k, c, a) => legs(k, (leg, s) => {
    const L = k.d.legL - 2.4, w = k.d.legW + 0.2;
    k.box(leg, w, L, w, 0, -L / 2, 0, c);

// ---------------------------------------------------------------- the class
class BlockyCharacter {
  constructor(THREE, config = {}, { px = 0.056 } = {}) {
    this.THREE = THREE;
    this.px = px;
    this.root = new THREE.Group();
    this.root.name = 'Character';
    this.mixer = new THREE.AnimationMixer(this.root);
    this.current = null;
    this.set(config, true);
  }

  static normalize(config = {}) {
    const base = config.body === 'female' ? DEFAULT_FEMALE : DEFAULT_MALE;
    const part = (v, def) => (typeof v === 'string' ? { ...def, style: v } : { ...def, ...(v || {}) });
    const out = {
      ...base, ...config,
      hair: part(config.hair, base.hair),
      facialHair: part(config.facialHair, base.facialHair),
      top: part(config.top, base.top),
      bottom: part(config.bottom, base.bottom),
      shoes: part(config.shoes, base.shoes),
      accessories: (config.accessories ?? base.accessories).map((a) => (typeof a === 'string' ? { type: a } : { ...a })),
    };
    return out;
  }

  /** Change any part of the config and rebuild in place. */
  set(patch = {}, replace = false) {
    const prev = this.config ?? {};
    const merged = replace ? patch : { ...prev, ...patch };
    this.config = BlockyCharacter.normalize(merged);
    const playing = this.current?.getClip().name;
    this._clear();
    this._build();
    this.play(playing && this.clipNames.includes(playing) ? playing : this.defaultClip, 0);
    return this;
  }

  toJSON() { return JSON.parse(JSON.stringify(this.config)); }

  get clipNames() { return this.clips.map((c) => c.name); }

  play(name = this.defaultClip, fade = 0.25) {
    const clip = this.clips.find((c) => c.name === name);
    if (!clip) return this;
    const next = this.mixer.clipAction(clip);
    if (this.current === next) return this;
    next.reset().play();
    if (this.current && fade > 0) this.current.crossFadeTo(next, fade, false);
    else if (this.current) this.current.stop();
    this.current = next;
    return this;
  }

  update(dt) { this.mixer.update(dt); }

  dispose() { this._clear(); }

  _clear() {
    this.mixer.stopAllAction();
    this.current = null;
    if (this.clips) this.clips.forEach((c) => this.mixer.uncacheClip(c));
    this.mixer.uncacheRoot(this.root);
    for (const child of [...this.root.children]) this.root.remove(child);
    (this._geoms || []).forEach((g) => g.dispose());
    (this._mats ? [...this._mats.values()] : []).forEach((m) => m.dispose());
    this._geoms = [];
    this._mats = new Map();
  }

  _build() {
    const THREE = this.THREE, px = this.px, cfg = this.config;
    const female = cfg.body === 'female';
    const B = BUILDS[cfg.build] ?? BUILDS.average, H = HEIGHTS[cfg.height] ?? HEIGHTS.average;
    const armW = (female ? 3 : 4) + B.armDelta;
    const d = {
      ...B, ...H, armW,
      legX: B.tw / 4 + 0.15,
      sx: B.tw / 2 + armW / 2 + 0.15,
      armTop: 2, handTop: -(H.th - 2) + 3, // arm runs from +2 (above shoulder) to -(th-2)
    };
    d.handY = d.handTop - 1.5;

    const mat = (color, o = {}) => {
      const key = `${color}|${o.opacity ?? 1}|${o.emissive ?? 0}`;
      if (!this._mats.has(key)) {
        const m = new THREE.MeshStandardMaterial({ color, roughness: 1, metalness: 0, flatShading: true });
        if (o.opacity !== undefined) { m.transparent = true; m.opacity = o.opacity; m.depthWrite = false; }
        if (o.emissive) { m.emissive = new THREE.Color(color); m.emissiveIntensity = o.emissive; }
        this._mats.set(key, m);
      }
      return this._mats.get(key);
    };
    const box = (parent, w, h, dd, x, y, z, color, o) => {
      const g = new THREE.BoxGeometry(w * px, h * px, dd * px);
      this._geoms.push(g);
      const m = new THREE.Mesh(g, mat(color, o));
      m.position.set(x * px, y * px, z * px);
      m.castShadow = o?.opacity === undefined;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    };
    const joint = (parent, name, x = 0, y = 0, z = 0) => {
      const g = new THREE.Group();
      g.name = name;
      g.position.set(x * px, y * px, z * px);
      parent.add(g);
      return g;
    };

    // resolve colors
    const C = (c, f) => toColorNum(THREE, c, f);
    const skinNum = C(cfg.skin);

    // accessories → slots
    const acc = cfg.accessories
      .map((a) => ({ ...a, def: ACCESSORIES[a.type] }))
      .filter((a) => a.def);
    const hands = {};
    const warnings = [];
    let ride = null;
    for (const a of acc) {
      if (a.def.slot === 'hand') {
        const want = a.def.hand === 'both' ? ['L', 'R'] : [a.side ?? a.def.hand];
        for (const h of want) {
          if (hands[h]) warnings.push(`${a.type} replaced ${hands[h].type} in hand ${h}`);
          hands[h] = a;
        }
      }
      if (a.def.slot === 'ride') { if (ride) warnings.push(`${a.type} replaced ${ride.type}`); ride = a; }
    }
    this.warnings = warnings;
    const flags = {
      hat: acc.some((a) => a.def.hat),
      tallHair: ['quiff', 'spiky', 'afro', 'bun', 'mohawk'].includes(cfg.hair.style),
      handL: !!hands.L, handR: !!hands.R, ride: ride?.type, hover: !!ride?.def.hover,
    };

    // skeleton
    const n = {};
    n.ride = joint(this.root, 'Ride');
    n.board = joint(n.ride, 'Board');
    n.body = joint(n.ride, 'Body');
    n.hips = joint(n.body, 'Hips', 0, d.legL, 0);
    n.legL = joint(n.hips, 'LegL', d.legX, 0, 0);
    n.legR = joint(n.hips, 'LegR', -d.legX, 0, 0);
    n.spine = joint(n.hips, 'Spine');
    n.neck = joint(n.spine, 'Neck', 0, d.th - 0.5, 0);
    n.head = joint(n.neck, 'Head');
    n.armL = joint(n.spine, 'ArmL', d.sx, d.th - 2, 0);
    n.armR = joint(n.spine, 'ArmR', -d.sx, d.th - 2, 0);
    n.handL = joint(n.armL, 'HandL', 0, d.handY, 0);
    n.handR = joint(n.armR, 'HandR', 0, d.handY, 0);

    const k = {
      THREE, n, d, cfg, flags, box, joint, skin: skinNum,
      shade: (c, f) => shade(THREE, c, f), mix: (a, b, t) => mix(THREE, a, b, t),
      has: (type) => acc.some((a) => a.type === type),
    };

    // skin base
    const skin = skinNum, skinShade = shade(THREE, skin, 0.86);
    for (const leg of [n.legL, n.legR]) box(leg, d.legW, d.legL, d.legW, 0, -d.legL / 2, 0, skin);
    for (const arm of [n.armL, n.armR]) {
      const len = d.armTop - (d.handTop - 3);
      box(arm, armW, len, armW, 0, d.armTop - len / 2, 0, skin);
    }
    box(n.head, 8, 8, 8, 0, 4.5, 0, skin);

    // clothes
    const topFn = TOPS[cfg.top.style] ?? TOPS.tshirt;
    topFn(k, C(cfg.top.color), cfg.top.accent !== undefined ? C(cfg.top.accent) : undefined);
    let bottomStyle = cfg.bottom.style;
    if (topFn.coversLegs && !['leggings', 'bare'].includes(bottomStyle)) bottomStyle = 'bare';
    (BOTTOMS[bottomStyle] ?? BOTTOMS.pants)(k, C(cfg.bottom.color), cfg.bottom.accent !== undefined ? C(cfg.bottom.accent) : undefined);
    (SHOES[cfg.shoes.style] ?? SHOES.simple)(k, C(cfg.shoes.color), cfg.shoes.accent !== undefined ? C(cfg.shoes.accent) : undefined);

    // face
    const hairC = C(cfg.hair.color);
    const fhStyle = cfg.facialHair.style;
    (HAIR_STYLES[cfg.hair.style] ?? HAIR_STYLES.short)(k, hairC);
    (FACIAL_HAIR[fhStyle] ?? FACIAL_HAIR.none)(k, C(cfg.facialHair.color ?? cfg.hair.color));
    const brow = cfg.hair.style === 'none' ? shade(THREE, skin, 0.55) : shade(THREE, hairC, 0.8);
    for (const s of [1, -1]) {
      box(n.head, 1, 1, 0.3, 1.5 * s, 5.5, 4.1, C(cfg.eyes));
      box(n.head, 0.5, 1, 0.3, 2.25 * s, 5.5, 4.08, 0xfff6ea);
      box(n.head, 1.5, 0.4, 0.3, 1.6 * s, 6.6, 4.1, brow);
      box(n.head, 0.4, 1.5, 1.2, 4.1 * s, 4.6, 0.9, skinShade);
      if (female) box(n.head, 0.5, 0.4, 0.3, 2.6 * s, 6.1, 4.12, 0x2a1512);
      if (cfg.freckles) for (const [x, y] of [[2.4, 4.2], [3.1, 4.6], [2.9, 3.8]]) box(n.head, 0.4, 0.4, 0.22, x * s, y, 4.05, shade(THREE, skin, 0.72));
    }
    box(n.head, 1, 1.4, 0.6, 0, 4.6, 4.2, skinShade);
    if (fhStyle === 'beard') box(n.head, 3, 0.5, 0.3, 0, 3.4, 4.2, skinShade);
    else if (fhStyle !== 'goatee') box(n.head, 2, 0.4, 0.25, 0, 3.0, 4.1, female ? C(cfg.lips ?? '#c4566a') : shade(THREE, skin, 0.7));

    // accessories
    const itemNodes = {};
    let boardTop = 0;
    for (const a of acc) {
      const c = C(a.color ?? a.def.color), ac = a.accent !== undefined ? C(a.accent) : undefined;
      if (a.def.slot === 'hand') {
        const sides = a.def.hand === 'both' ? ['L'] : [a.side ?? a.def.hand];
        for (const h of sides) {
          if (hands[h] !== a) continue;
          const item = joint(n['hand' + h], 'Item' + h);
          if (a.def.upright) item.rotation.set(-(a.def.pose?.x ?? 0) * a.def.upright, 0, (a.def.pose?.z ?? 0) * (h === 'L' ? 1 : -1));
          itemNodes[h] = item;
          a.def.build(k, c, ac, item, h === 'L' ? 1 : -1);
        }
      } else if (a.def.slot === 'ride') {
        if (ride === a) boardTop = a.def.build(k, c, ac) ?? 0;
      } else {
        a.def.build(k, c, ac);
      }
    }

    // stance on a board: stand sideways and look forward
    if (ride) {
      n.body.position.y = boardTop * px;
      n.body.rotation.y = 1.35;
    }

    // animation
    const rig = { d, px, hands, ride, flags, itemNodes };
    this.clips = ride
      ? [rideClip(THREE, rig, true), rideClip(THREE, rig, false)]
      : [walkClip(THREE, rig), idleClip(THREE, rig), waveClip(THREE, rig)];
    this.defaultClip = this.clips[0].name;
  }

  // ---- registry helpers
  static registerAccessory(name, def) { ACCESSORIES[name] = def; }
  static registerHair(name, fn) { HAIR_STYLES[name] = fn; }
  static registerTop(name, fn) { TOPS[name] = fn; }
  static registerBottom(name, fn) { BOTTOMS[name] = fn; }
  static registerShoes(name, fn) { SHOES[name] = fn; }

  static get options() {
    return {
      body: ['male', 'female'], build: Object.keys(BUILDS), height: Object.keys(HEIGHTS),
      hair: Object.keys(HAIR_STYLES), facialHair: Object.keys(FACIAL_HAIR),
      top: Object.keys(TOPS), bottom: Object.keys(BOTTOMS), shoes: Object.keys(SHOES),
      accessories: Object.keys(ACCESSORIES),
    };
  }

  /** Random but coherent character. Pass a seed for repeatable results. */
  static random(seed = Math.random() * 1e9) {
    let s = Math.floor(seed) || 1;
    const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    const pick = (arr) => arr[Math.floor(r() * arr.length)];
    const body = pick(['male', 'female']);
    const hairPool = body === 'female' ? ['long', 'bob', 'ponytail', 'bun', 'pigtails', 'afro', 'short'] : ['short', 'quiff', 'buzz', 'spiky', 'afro', 'none', 'mohawk', 'long'];
    const colors = ['#4f86d9', '#d64545', '#3fae6c', '#e0a23a', '#8a5ad8', '#2d2d33', '#f2ece2', '#e86fa3', '#2f8f8f', '#b3213d'];
    const acc = [];
    const head = pick([null, null, 'cap', 'beanie', 'headphones']);
    if (head) acc.push(head);
    if (r() < 0.3) acc.push(pick(['glasses', 'sunglasses']));
    if (r() < 0.35) acc.push(pick(['backpack', 'scarf', 'watch', 'camera']));
    if (r() < 0.45) acc.push(pick(['phone', 'coffee', 'book', 'tablet', 'briefcase']));
    if (r() < 0.12) acc.push(pick(['skateboard', 'hoverboard']));
    return {
      name: 'Random', body,
      build: pick(['skinny', 'average', 'average', 'chubby']), height: pick(['short', 'average', 'average', 'tall']),
      skin: pick(Object.values(SKIN_TONES)), eyes: pick(Object.values(EYE_COLORS)), freckles: r() < 0.15,
      hair: { style: pick(hairPool), color: pick(Object.values(HAIR_COLORS).slice(0, r() < 0.15 ? 13 : 9)) },
      facialHair: { style: body === 'male' ? pick(['none', 'none', 'stubble', 'moustache', 'goatee', 'beard']) : 'none' },
      top: { style: pick(body === 'female' ? Object.keys(TOPS) : Object.keys(TOPS).filter((t) => t !== 'dress')), color: pick(colors) },
      bottom: { style: pick(['pants', 'jeans', 'joggers', 'shorts', 'widePants', ...(body === 'female' ? ['skirt', 'leggings'] : [])]), color: pick(['#3b4357', '#2f4e7a', '#3b1714', '#5b5b5b', '#2a2a2e', '#c7b28a']) },
      shoes: { style: pick(['simple', 'sneakers', 'hightops', 'boots']), color: pick(colors) },
      accessories: acc,
    };
  }
}

// ---------------------------------------------------------------- animation
function track(THREE, name, duration, N, fn, kind = 'q') {
  const times = Array.from({ length: N + 1 }, (_, i) => (i / N) * duration);
  const v = [];
  const q = new THREE.Quaternion(), e = new THREE.Euler();
  for (const t of times) {
    const p = (t / duration) * Math.PI * 2;
    const r = fn(p);
    if (kind === 'q') { q.setFromEuler(e.set(r[0], r[1], r[2])); v.push(q.x, q.y, q.z, q.w); }
    else v.push(...r);
  }
  return kind === 'q'
    ? new THREE.QuaternionKeyframeTrack(`${name}.quaternion`, times, v)
    : new THREE.VectorKeyframeTrack(`${name}.position`, times, v);
}

function armTrack(THREE, rig, side, dur, N, freeFn) {
  const s = side === 'L' ? 1 : -1;
  const item = rig.hands[side];
  if (item?.def.pose) {
    const { x = 0, z = 0 } = item.def.pose;
    return track(THREE, 'Arm' + side, dur, N, (p) => [x + Math.sin(p * 2) * 0.03, 0, z * -s]);
  }
  return track(THREE, 'Arm' + side, dur, N, (p) => freeFn(p, item?.def.swing ?? 1, s));
}

function walkClip(THREE, rig) {
  const { d, px } = rig, D = 1, N = 16, sin = Math.sin;
  const tracks = [
    track(THREE, 'Hips', D, N, (p) => [0, (d.legL + Math.abs(sin(p)) * 0.4) * px, 0], 'v'),
    track(THREE, 'Spine', D, N, (p) => [0.04, -sin(p) * 0.06, 0]),
    track(THREE, 'Neck', D, N, (p) => [-0.04 + Math.abs(sin(p)) * 0.05, sin(p) * 0.08, 0]),
    track(THREE, 'LegL', D, N, (p) => [-sin(p) * 0.6, 0, 0]),
    track(THREE, 'LegR', D, N, (p) => [sin(p) * 0.6, 0, 0]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.65 * sw, 0, 0.05 * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.65 * sw, 0, 0.05 * s]),
  ];
  for (const side of ['L', 'R']) {
    const it = rig.hands[side];
    if (it && !it.def.pose && rig.itemNodes[side]) tracks.push(track(THREE, 'Item' + side, D, N, (p) => [sin(p - 0.6) * 0.15 * (side === 'L' ? -1 : 1), 0, 0]));
  }
  return new THREE.AnimationClip('Walk', D, tracks);
}

function idleClip(THREE, rig) {
  const { d, px } = rig, D = 3, N = 24, sin = Math.sin;
  return new THREE.AnimationClip('Idle', D, [
    track(THREE, 'Hips', D, N, (p) => [0, (d.legL - Math.abs(sin(p)) * 0.12) * px, 0], 'v'),
    track(THREE, 'Spine', D, N, (p) => [sin(p * 2) * 0.012, 0, 0]),
    track(THREE, 'Neck', D, N, (p) => [0.02, sin(p) * 0.25, sin(p * 2) * 0.02]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.02]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.02]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.03, 0, (0.06 + sin(p * 2) * 0.015) * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.03, 0, (0.06 + sin(p * 2) * 0.015) * s]),
  ]);
}

function waveClip(THREE, rig) {
  const { d, px } = rig, D = 1.2, N = 24, sin = Math.sin;
  const side = rig.hands.R && !rig.hands.L ? 'L' : rig.hands.R ? null : 'R';
  const sg = side === 'L' ? 1 : -1;
  const wave = (s) => track(THREE, 'Arm' + s, D, N, (p) => [-0.2, 0, (2.5 + sin(p * 2) * 0.3) * (s === 'L' ? 1 : -1)]);
  const still = (s) => armTrack(THREE, rig, s, D, N, (p, sw, k) => [0, 0, 0.06 * k]);
  return new THREE.AnimationClip('Wave', D, [
    track(THREE, 'Hips', D, N, (p) => [0, (d.legL + Math.abs(sin(p)) * 0.1) * px, 0], 'v'),
    track(THREE, 'Spine', D, N, (p) => [0, 0, sin(p * 2) * 0.03 * sg]),
    track(THREE, 'Neck', D, N, (p) => [0.04, 0, 0.1 * sg + sin(p * 2) * 0.03]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.02]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.02]),
    side === 'L' ? wave('L') : still('L'),
    side === 'R' ? wave('R') : still('R'),
  ]);
}

function rideClip(THREE, rig, moving) {
  const { d, px, ride } = rig, D = 2, N = 24, sin = Math.sin;
  const hover = ride.def.hover;
  const bob = hover ? 0.7 : moving ? 0.08 : 0;
  const tracks = [
    track(THREE, 'Ride', D, N, (p) => [0, (hover ? 1.5 : 0) * px + sin(p * (hover ? 1 : 8)) * bob * px, 0], 'v'),
    track(THREE, 'Hips', D, N, (p) => [0, (d.legL * Math.cos(0.18) + 0.05 + Math.abs(sin(p * 2)) * 0.15) * px, 0], 'v'),
    track(THREE, 'Spine', D, N, (p) => [0.05, 0, (moving ? sin(p) * 0.05 : 0)]),
    track(THREE, 'Neck', D, N, (p) => [0, -1.15 + (moving ? 0 : sin(p) * 0.2), 0]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.18]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.18]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.1, 0, (0.45 + sin(p * 2) * 0.08) * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.1, 0, (0.45 + sin(p * 2 + 1) * 0.08) * s]),
  ];
  if (hover) tracks.push(track(THREE, 'Board', D, N, (p) => [sin(p) * 0.03, 0, sin(p * 2) * 0.02]));
  return new THREE.AnimationClip(moving ? 'Ride' : 'Idle', D, tracks);
}

  briefcase: { slot: 'hand', hand: 'R', swing: 0.3, color: '#5a2a1e', build: (k, c, a, h) => {
    const r = k.d.limb * 1.35;
    k.add(h, k.G.torus(0.55, 0.13, 4, 8, Math.PI), k.shade(c, 0.6), { p: [0, -r * 0.6, 0], r: [0, Math.PI / 2, Math.PI] });
    k.add(h, k.G.box(1.1, 2.4, 3.6), c, { p: [0, -r - 1.4, 0]});
    k.add(h, k.G.box(1.2, 0.3, 0.6), 0xe8c25a, { p: [0, -r - 0.5, 0] });
  } },
  book: { slot: 'hand', hand: 'L', swing: 0.4, color: '#3a6ea5', build: (k, c, a, h, s) => {
    const r = k.d.limb * 1.35, x = (r + 0.3) * s;
    k.add(h, k.G.box(0.65, 3.0, 2.3), c, { p: [x, -0.4, 0.2] });
    k.add(h, k.G.box(0.5, 2.8, 2.15), 0xf7f2e6, { p: [x + 0.1 * s, -0.4, 0.3] });
  } },
  phone: { slot: 'hand', hand: 'R', pose: { x: -1.05, z: 0.25 }, upright: 0.9, color: '#3d7bf2', build: (k, c, a, h) => {
    const r = k.d.limb * 1.35;
    k.add(h, k.G.box(1.5, 2.6, 0.3), c, { p: [0, r + 0.7, 0.15] });
    k.add(h, k.G.box(1.3, 2.3, 0.05), a ?? 0x8fe0ff, { p: [0, r + 0.75, -0.02], emissive: 0.8 });
  } },
  coffee: { slot: 'hand', hand: 'L', pose: { x: -0.8, z: 0.1 }, upright: 1, color: '#f7f2ea', build: (k, c, a, h, s) => {
    const r = k.d.limb * 1.35, x = -(r + 0.55) * s;
    k.add(h, k.G.cyl(0.75, 0.6, 1.9, 8), c, { p: [x, 0.35, 0] });
    k.add(h, k.G.cyl(0.82, 0.82, 0.35, 8), 0x3b2a20, { p: [x, 1.45, 0] });
    k.add(h, k.G.cyl(0.74, 0.68, 0.75, 8), a ?? 0xd9653b, { p: [x, 0.3, 0] });
  } },
  tablet: { slot: 'hand', hand: 'both', pose: { x: -0.95, z: 0.12 }, upright: 0.75, color: '#e8ecf2', build: (k, c, a, h, s) => {
    const hx = k.d.sx - (k.d.armLen) * 0.12, x = -hx * s, r = k.d.limb * 1.35;
    k.add(h, k.G.box(hx * 2 + 1.4, 3.4, 0.3), c, { p: [x, r + 1.2, r * 0.6] });
    k.add(h, k.G.box(hx * 2 + 0.9, 2.9, 0.05), a ?? 0x8fe0ff, { p: [x, r + 1.2, r * 0.6 - 0.17], emissive: 0.7 });
  } },
  icecream: { slot: 'hand', hand: 'L', pose: { x: -0.7, z: -0.45 }, upright: 1, color: '#f4a7c4', build: (k, c, a, h) => {
    const r = k.d.limb * 1.35;
    k.add(h, k.G.cone(0.85, 2.6, 6), 0xd9a35a, { p: [0, r + 0.75, 0.6], r: [Math.PI, 0, 0] });
    k.add(h, k.G.ico(1.15, 1), c, { p: [0, r + 2.4, 0.6] });
    k.add(h, k.G.ico(0.38, 0), 0xc8262f, { p: [0, r + 3.6, 0.6] });
  } },
  balloon: { slot: 'hand', hand: 'L', pose: { x: -0.25, z: -0.55 }, upright: 1, color: '#e2453b', build: (k, c, a, h, s) => {
    const lean = 0.42 * s, L = 11;                        // string leans away from the head
    k.add(h, k.G.cyl(0.05, 0.05, L, 3), 0xdddddd, { p: [Math.sin(lean) * L / 2, Math.cos(lean) * L / 2, 0], r: [0, 0, -lean] });
    const tx = Math.sin(lean) * L, ty = Math.cos(lean) * L;
    k.add(h, k.G.cone(0.35, 0.5, 5), c, { p: [tx, ty + 0.1, 0], r: [Math.PI, 0, 0] });
    k.add(h, k.G.ico(2.2, 1), c, { p: [tx, ty + 2.6, 0], s: [1, 1.15, 1]});
  } },
  skateboard: { slot: 'ride', color: '#d9653b', build: (k, c, a) => {
    const b = k.n.board;
    k.add(b, k.G.box(3.2, 0.35, 10), c, { p: [0, 1.55, 0] });
    k.add(b, k.G.box(3.0, 0.08, 9.6), 0x2a2a2e, { p: [0, 1.75, 0] });
    for (const s of [1, -1]) {
      k.add(b, k.G.box(3.2, 0.35, 1.6), c, { p: [0, 1.8, 5.6 * s], r: [-0.4 * s, 0, 0] });
      k.add(b, k.G.box(2.2, 0.4, 0.7), 0x9aa0a8, { p: [0, 1.15, 3.4 * s] });
      for (const x of [1.4, -1.4]) k.add(b, k.G.cyl(0.5, 0.5, 0.55, 7), a ?? 0xf2efe6, { p: [x, 0.5, 3.4 * s], r: [0, 0, Math.PI / 2] });
    }
    return 1.8;
  } },
  hoverboard: { slot: 'ride', hover: true, color: '#e8ecf2', build: (k, c, a) => {
    const b = k.n.board;
    k.add(b, k.G.cyl(2.2, 2.0, 0.7, 8), c, { p: [0, 2.0, 0], s: [1, 1, 2.3] });
    k.add(b, k.G.cyl(1.6, 1.6, 0.2, 8), a ?? 0x37d6ff, { p: [0, 1.55, 0], s: [1, 1, 2.3], emissive: 1.2 });
    return 2.35;
  } },
};

// ---------------------------------------------------------------- class
class ChibiCharacter {
  constructor(THREE, config = {}, { scale = 0.06 } = {}) {
    this.THREE = THREE;
    this.scale = scale;
    this.root = new THREE.Group();
    this.root.name = 'ChibiCharacter';
    this.mixer = new THREE.AnimationMixer(this.root);
    this.current = null;
    this.set(config, true);
  }

  static normalize(config = {}) {
    const base = config.body === 'female' ? DEFAULT_FEMALE : DEFAULT_MALE;
    const part = (v, def) => (typeof v === 'string' ? { ...def, style: v } : { ...def, ...(v || {}) });
    return {
      ...base, ...config,
      eyes: typeof config.eyes === 'string' && !EYE_STYLES.includes(config.eyes) ? { ...base.eyes, color: config.eyes } : part(config.eyes, base.eyes),
      hair: part(config.hair, base.hair),
      facialHair: part(config.facialHair, base.facialHair),
      top: part(config.top, base.top),
      bottom: part(config.bottom, base.bottom),
      shoes: part(config.shoes, base.shoes),
      accessories: (config.accessories ?? base.accessories).map((a) => (typeof a === 'string' ? { type: a } : { ...a })),
    };
  }

  set(patch = {}, replace = false) {
    this.config = ChibiCharacter.normalize(replace ? patch : { ...(this.config ?? {}), ...patch });
    const playing = this.current?.getClip().name;
    this._clear();
    this._build();
    this.play(playing && this.clipNames.includes(playing) ? playing : this.defaultClip, 0);
    return this;
  }
  toJSON() { return JSON.parse(JSON.stringify(this.config)); }
  get clipNames() { return this.clips.map((c) => c.name); }
  play(name = this.defaultClip, fade = 0.25) {
    const clip = this.clips.find((c) => c.name === name);
    if (!clip) return this;
    const next = this.mixer.clipAction(clip);
    if (this.current === next) return this;
    next.reset().play();
    if (this.current && fade > 0) this.current.crossFadeTo(next, fade, false);
    else if (this.current) this.current.stop();
    this.current = next;
    return this;
  }
  update(dt) { this.mixer.update(dt); }
  dispose() { this._clear(); }

  _clear() {
    this.mixer.stopAllAction();
    this.current = null;
    (this.clips || []).forEach((c) => this.mixer.uncacheClip(c));
    this.mixer.uncacheRoot(this.root);
    for (const ch of [...this.root.children]) this.root.remove(ch);
    (this._geoms || []).forEach((g) => g.dispose());
    (this._mats ? [...this._mats.values()] : []).forEach((m) => m.dispose());
    this._geoms = []; this._mats = new Map();
  }

  _build() {
    const THREE = this.THREE, cfg = this.config;
    const female = cfg.body === 'female';
    const B = BUILDS[cfg.build] ?? BUILDS.average, H = HEIGHTS[cfg.height] ?? HEIGHTS.average;
    const tr = B.tr * (female ? 0.92 : 1), limb = B.limb * (female ? 0.9 : 1);
    const d = { ...B, ...H, tr, limb, armLen: H.th * 0.82 + 0.3, depth: 0.82 };
    d.sx = tr * 0.92 + limb * 0.7;
    const C = (c, fb) => num(THREE, c, fb);
    const skin = C(cfg.skin);

    // geometry factory (all in units)
    // primitives are authored at low counts and scaled up here for smooth, rounded shapes
    const up = (n, f, min) => Math.max(min, Math.round(n * f));
    const G = {
      ico: (r, det = 1) => new THREE.SphereGeometry(r, det ? 26 : 18, det ? 18 : 12),
      sph: (r, w = 8, h = 6, ps = 0, pl = Math.PI * 2, ts = 0, tl = Math.PI) => new THREE.SphereGeometry(r, up(w, 3, 20), up(h, 3, 12), ps, pl, ts, tl),
      cyl: (rt, rb, h, seg = 7, ts = 0, tl = Math.PI * 2, open = false) => new THREE.CylinderGeometry(rt, rb, h, up(seg, 3, 18), 1, open, ts, tl),
      cone: (r, h, seg = 6) => new THREE.ConeGeometry(r, h, up(seg, 3, 14)),
      box: (w, h, dd) => new THREE.BoxGeometry(w, h, dd),
      torus: (r, t, rs = 5, ts = 10, arc = Math.PI * 2) => new THREE.TorusGeometry(r, t, up(rs, 2.5, 10), up(ts, 3, 28), arc),
      lathe: (pts, seg = 8) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), up(seg, 3, 24)),
    };
    const mat = (color, o = {}) => {
      const key = `${color}|${o.double ? 1 : 0}|${o.emissive ?? 0}`;
      if (!this._mats.has(key)) {
        const m = new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0, side: o.double ? THREE.DoubleSide : THREE.FrontSide });
        if (o.emissive) { m.emissive = new THREE.Color(color); m.emissiveIntensity = o.emissive; }
        this._mats.set(key, m);
      }
      return this._mats.get(key);
    };
    const finish = (geo) => {
      if (!geo.attributes.normal) geo.computeVertexNormals();
      this._geoms.push(geo);
      return geo;
    };
    const add = (parent, geo, color, o = {}) => {
      const m = new THREE.Mesh(finish(geo), mat(color, o));
      if (o.p) m.position.set(...o.p);
      if (o.r) m.rotation.set(...o.r);
      if (o.s) typeof o.s === 'number' ? m.scale.setScalar(o.s) : m.scale.set(...o.s);
      if (o.q) m.quaternion.premultiply(o.q);
      m.castShadow = true; m.receiveShadow = true;
      parent.add(m);
      return m;
    };
    const joint = (parent, name, x = 0, y = 0, z = 0) => {
      const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); parent.add(g); return g;
    };

    // accessories → slots
    const acc = cfg.accessories.map((a) => ({ ...a, def: ACCESSORIES[a.type] })).filter((a) => a.def);
    const hands = {}, warnings = [];
    let ride = null;
    for (const a of acc) {
      if (a.def.slot === 'hand') for (const h of a.def.hand === 'both' ? ['L', 'R'] : [a.side ?? a.def.hand]) {
        if (hands[h]) warnings.push(`${a.type} replaced ${hands[h].type} in the ${h === 'L' ? 'left' : 'right'} hand`);
        hands[h] = a;
      }
      if (a.def.slot === 'ride') { if (ride) warnings.push(`${a.type} replaced ${ride.type}`); ride = a; }
    }
    this.warnings = warnings;
    const flags = {
      hat: acc.some((a) => a.def.hat),
      tallHair: ['spiky', 'quiff', 'afro', 'bun', 'mohawk', 'curly'].includes(cfg.hair.style),
      handL: !!hands.L, handR: !!hands.R,
    };

    // skeleton (rig is scaled; everything inside is in units)
    const n = {};
    n.rig = joint(this.root, 'Rig'); n.rig.scale.setScalar(this.scale);
    n.ride = joint(n.rig, 'Ride');
    n.board = joint(n.ride, 'Board');
    n.body = joint(n.ride, 'Body');
    n.hips = joint(n.body, 'Hips', 0, d.legL, 0);
    const legX = tr * 0.48;
    n.legL = joint(n.hips, 'LegL', legX, 0, 0);
    n.legR = joint(n.hips, 'LegR', -legX, 0, 0);
    n.spine = joint(n.hips, 'Spine', 0, 0.4, 0);
    n.neck = joint(n.spine, 'Neck', 0, d.th, 0);
    n.armL = joint(n.spine, 'ArmL', d.sx, d.th - 0.75, 0);
    n.armR = joint(n.spine, 'ArmR', -d.sx, d.th - 0.75, 0);
    n.handL = joint(n.armL, 'HandL', 0, -d.armLen, 0);
    n.handR = joint(n.armR, 'HandR', 0, -d.armLen, 0);
    const headShape = joint(n.neck, 'HeadShape', 0, R * 0.8, 0.15);
    headShape.scale.set(1, 0.95, 0.93);

    // torso profile radius at height y (spine space), used to place things on the chest
    const ctrl = [[tr * 1.02, -0.2], [tr * (1 + B.belly), d.th * 0.4], [tr * 0.95, d.th * 0.8], [tr * 0.55, d.th]];
    // a curved outline through the control points (no ridge at the belly)
    const prof = new THREE.SplineCurve(ctrl.map(([r, y]) => new THREE.Vector2(r, y))).getPoints(16).map((v) => [v.x, v.y]);
    const torsoR = (y) => {
      for (let i = 1; i < prof.length; i++) if (y <= prof[i][1]) {
        const [r0, y0] = prof[i - 1], [r1, y1] = prof[i]; return r0 + ((r1 - r0) * (y - y0)) / (y1 - y0);
      }
      return prof[prof.length - 1][0];
    };
    const dirOf = (u, v) => new THREE.Vector3(Math.sin(u) * Math.cos(v), Math.sin(v), Math.cos(u) * Math.cos(v));

    const k = {
      THREE, G, n, d, cfg, flags, skin, headShape, add, joint,
      shade: (c, f) => shade(THREE, c, f), mix: (a, b, t) => mixc(THREE, a, b, t),
      has: (t) => acc.some((a) => a.type === t),
      frontZ: (y) => torsoR(y) * d.depth,
      torsoR,
      // place geometry on the head surface at angles u (around, + = character's left) and v (up), pushed out by `out`
      onHead(geo, color, u, v, out = 0, o = {}) {
        const dir = dirOf(u, v);
        const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, o.up ? 1 : 0, o.up ? 0 : 1), dir);
        if (o.tilt) q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), o.tilt));
        const m = add(headShape, geo, color, { ...o, p: dir.multiplyScalar(R + out).toArray(), r: undefined, q });
        if (o.r) { const e = new THREE.Quaternion().setFromEuler(new THREE.Euler(...o.r)); m.quaternion.multiply(e); }
        return m;
      },
      spike(color, u, v, out, len, lean = 0.3, o = {}) {
        const m = k.onHead(G.cone(0.85, len, 4), color, u, v, out + len * 0.3, { up: true});
        m.rotateX(-lean * 0.4); if (o.side) m.rotateZ(-o.side * 0.6);
        return m;
      },
      cap(color, scale = 1.07, theta = 0.5) {
        if (flags.hat) scale = Math.min(scale, 1.035);
        add(headShape, G.sph(R * scale, 10, 7, 0, Math.PI * 2, 0, Math.PI * theta), color, { r: [-0.38, 0, 0], double: true});
      },
      bangs(color) {
        add(headShape, G.sph(R * (flags.hat ? 1.04 : 1.09), 8, 3, Math.PI / 2 - 0.85, 1.7, Math.PI * 0.2, Math.PI * 0.2), color, { double: true});
      },
      // chunky hanging locks around the sides and back (u from +uMin around the back to -uMin)
      locks(color, len, uMin, count) {
        for (let i = 0; i < count; i++) {
          const u = uMin + ((Math.PI * 2 - 2 * uMin) * i) / (count - 1);
          const r = R * 0.9 + 0.45, x = Math.sin(u) * r, z = Math.cos(u) * r;
          add(headShape, G.ico(1.5, 0), i % 2 ? k.shade(color, 0.9) : color,
            { p: [x, R * 0.3 - len / 2, z], s: [0.95, len / 3.0, 0.8], r: [0, u, 0]});
        }
      },
      shell(color, scale, t0, t1, phiLen) {
        add(headShape, G.sph(R * scale, 10, 6, Math.PI / 2 - (phiLen * Math.PI) / 2, phiLen * Math.PI, Math.PI * t0, Math.PI * (t1 - t0)), color, { double: true});
      },
      moustache(color, size) {
        for (const s of [1, -1]) k.onHead(G.ico(0.75 * size, 0), color, 0.2 * s, -0.27, 0.15 * size, { s: [1.5, 0.6, 0.8], r: [0, 0, -0.35 * s] });
      },
      torso(color) {
        add(n.spine, G.lathe([[0, -0.2], ...prof, [0, d.th]], 8), color, { s: [1, 1, d.depth] });
      },
      sleeves(color, len, cuff) {
        for (const arm of [n.armL, n.armR]) {
          add(arm, G.ico(limb * 1.45, 0), len ? color : skin, { p: [0, 0.1, 0] });
          if (!len) continue;
          const L = len === 'long' ? d.armLen - limb * 1.2 : d.armLen * 0.4;
          add(arm, G.cyl(limb * 1.32, limb * 1.25, L, 7), color, { p: [0, -L / 2 + 0.1, 0] });
          if (len === 'long') add(arm, G.cyl(limb * 1.42, limb * 1.42, 0.45, 7), cuff ?? color, { p: [0, -L + 0.3, 0] });
        }
      },
      collar(color, size = 1) {
        add(n.spine, G.torus(tr * 0.5, 0.2 * size, 4, 9), color, { p: [0, d.th - 0.05, 0], r: [Math.PI / 2, 0, 0], s: [1, d.depth * 1.05, 1] });
      },
      band(color, y, h) {
        add(n.spine, G.cyl(torsoR(y + h / 2) * 1.04, torsoR(y - h / 2) * 1.04, h, 8), color, { p: [0, y, 0], s: [1, 1, d.depth] });
      },
      hips(color) {
        add(n.hips, G.lathe([[0, -0.8], [tr * 0.9, -0.8], [tr * 0.93, 0.15], [tr * 0.8, 1.1], [0, 1.1]], 8), color, { s: [1, 1, d.depth * 0.97] });
      },
      legWear(color, frac, extra = 0.14) {
        const L = (d.legL - 0.9) * frac;
        for (const leg of [n.legL, n.legR]) add(leg, G.cyl(limb * 1.18 + extra, limb * 1.05 + extra, L + 0.2, 7), color, { p: [0, -L / 2 + 0.1, 0] });
      },
      legRing(color, frac) {
        const y = -(d.legL - 0.9) * frac;
        for (const leg of [n.legL, n.legR]) add(leg, G.cyl(limb * 1.3, limb * 1.3, 0.4, 7), color, { p: [0, y + 0.2, 0] });
      },
      feet(fn) { fn(n.legL, -d.legL); fn(n.legR, -d.legL); },
    };

    // base body (skin)
    for (const leg of [n.legL, n.legR]) add(leg, G.cyl(limb * 1.1, limb, d.legL - 0.5, 7), skin, { p: [0, -(d.legL - 0.5) / 2, 0] });
    for (const arm of [n.armL, n.armR]) add(arm, G.cyl(limb, limb * 0.92, d.armLen, 7), skin, { p: [0, -d.armLen / 2, 0] });
    for (const h of [n.handL, n.handR]) add(h, G.ico(limb * 1.35, 0), skin, {});
    add(n.neck, G.cyl(limb * 1.6, limb * 1.8, 1.2, 7), skin, { p: [0, 0.3, 0] });
    add(headShape, G.ico(R, 1), skin, {});

    // face
    const eyeC = C(cfg.eyes.color), dark = 0x2a1a16;
    for (const s of [1, -1]) {
      const style = cfg.eyes.style;
      if (style === 'closed') k.onHead(G.box(0.95, 0.2, 0.25), dark, 0.36 * s, -0.02, -0.05, { r: [0, 0, 0.18 * s] });
      else if (style === 'dots') k.onHead(G.sph(0.32, 6, 4), dark, 0.34 * s, 0, -0.08);
      else if (style === 'big') {
        k.onHead(G.sph(0.85, 7, 5), 0xfbf7f2, 0.37 * s, -0.02, -0.3, { s: [0.9, 1.1, 0.5] });
        k.onHead(G.sph(0.6, 7, 5), eyeC, 0.37 * s, -0.03, -0.1, { s: [0.9, 1.1, 0.5] });
        k.onHead(G.sph(0.18, 4, 3), 0xffffff, 0.34 * s, 0.05, 0.12);
      } else {
        k.onHead(G.sph(0.55, 7, 5), eyeC, 0.36 * s, -0.02, -0.12, { s: [0.85, 1.1, 0.5] });
        k.onHead(G.sph(0.15, 4, 3), 0xffffff, 0.33 * s, 0.05, 0.05);
      }
      const browC = cfg.hair.style === 'none' ? shade(THREE, skin, 0.55) : shade(THREE, C(cfg.hair.color), 0.85);
      k.onHead(G.box(1.05, 0.26, 0.25), browC, 0.38 * s, 0.27, -0.02, { r: [0, 0, -0.12 * s] });
      if (female && style !== 'closed') k.onHead(G.box(0.45, 0.16, 0.2), dark, 0.56 * s, 0.1, -0.02, { r: [0, 0, 0.6 * s] });
      if (cfg.cheeks) k.onHead(G.sph(0.6, 6, 4), mixc(THREE, skin, 0xe86f8a, 0.55), 0.62 * s, -0.17, -0.12, { s: [1.2, 0.7, 0.3] });
      k.onHead(G.ico(1, 0), shade(THREE, skin, 0.9), (Math.PI / 2) * 0.98 * s, -0.02, -0.25, { s: [0.45, 0.95, 0.75] });
    }

function track(THREE, name, D, N, fn, kind = 'q') {
  const times = Array.from({ length: N + 1 }, (_, i) => (i / N) * D), v = [];
  const q = new THREE.Quaternion(), e = new THREE.Euler();
  for (const t of times) {
    const r = fn((t / D) * Math.PI * 2);
    if (kind === 'q') { q.setFromEuler(e.set(r[0], r[1], r[2])); v.push(q.x, q.y, q.z, q.w); } else v.push(...r);
  }
  return kind === 'q' ? new THREE.QuaternionKeyframeTrack(`${name}.quaternion`, times, v) : new THREE.VectorKeyframeTrack(`${name}.position`, times, v);
}
function armTrack(THREE, rig, side, D, N, free) {
  const s = side === 'L' ? 1 : -1, item = rig.hands[side];
  if (item?.def.pose) { const { x = 0, z = 0 } = item.def.pose; return track(THREE, 'Arm' + side, D, N, (p) => [x + Math.sin(p * 2) * 0.04, 0, -z * s]); }
  return track(THREE, 'Arm' + side, D, N, (p) => free(p, item?.def.swing ?? 1, s));
}
function walkClip(THREE, rig) {
  const { d } = rig, D = 0.9, N = 16, sin = Math.sin;
  const tracks = [
    track(THREE, 'Hips', D, N, (p) => [0, d.legL + Math.abs(sin(p)) * 0.45, 0], 'v'),
    track(THREE, 'Body', D, N, (p) => [0, 0, sin(p) * 0.04]),
    track(THREE, 'Spine', D, N, (p) => [0.05, -sin(p) * 0.08, 0]),
    track(THREE, 'Neck', D, N, (p) => [-0.04 + Math.abs(sin(p)) * 0.06, sin(p) * 0.08, -sin(p) * 0.05]),
    track(THREE, 'LegL', D, N, (p) => [-sin(p) * 0.55, 0, 0]),
    track(THREE, 'LegR', D, N, (p) => [sin(p) * 0.55, 0, 0]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.6 * sw, 0, 0.12 * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.6 * sw, 0, 0.12 * s]),
  ];
  for (const side of ['L', 'R']) {
    const it = rig.hands[side];
    if (it && !it.def.pose && rig.itemNodes[side]) tracks.push(track(THREE, 'Item' + side, D, N, (p) => [sin(p - 0.6) * 0.15 * (side === 'L' ? -1 : 1), 0, 0]));

}
function idleClip(THREE, rig) {

    track(THREE, 'Hips', D, N, (p) => [0, d.legL - Math.abs(sin(p)) * 0.1, 0], 'v'),
    track(THREE, 'Body', D, N, () => [0, 0, 0]),
    track(THREE, 'Spine', D, N, (p) => [sin(p * 2) * 0.015, 0, 0]),
    track(THREE, 'Neck', D, N, (p) => [0.03, sin(p) * 0.3, sin(p * 2) * 0.04]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.03]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.03]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.04, 0, (0.14 + sin(p * 2) * 0.02) * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.04, 0, (0.14 + sin(p * 2) * 0.02) * s]),
  ]);
}
function waveClip(THREE, rig) {
  const { d } = rig, D = 1.2, N = 24, sin = Math.sin;
  const waveSide = rig.hands.R && !rig.hands.L ? 'L' : rig.hands.R ? null : 'R';
  const wave = (side) => track(THREE, 'Arm' + side, D, N, (p) => [-0.25, 0, (2.1 + sin(p * 2) * 0.3) * (side === 'L' ? 1 : -1)]);
  return new THREE.AnimationClip('Wave', D, [
    track(THREE, 'Hips', D, N, (p) => [0, d.legL + Math.abs(sin(p)) * 0.12, 0], 'v'),
    track(THREE, 'Body', D, N, () => [0, 0, 0]),
    track(THREE, 'Spine', D, N, (p) => [0, 0, sin(p * 2) * 0.03 * (waveSide === 'L' ? 1 : -1)]),
    track(THREE, 'Neck', D, N, (p) => [0.05, 0, (waveSide === 'L' ? 0.12 : -0.12) + sin(p * 2) * 0.04]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.03]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.03]),
    waveSide === 'L' ? wave('L') : armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [0, 0, 0.14 * s]),
    waveSide === 'R' ? wave('R') : armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [0, 0, 0.14 * s]),

    track(THREE, 'Hips', D, N, (p) => [0, d.legL * Math.cos(0.2) + Math.abs(sin(p * 2)) * 0.15, 0], 'v'),
    track(THREE, 'Spine', D, N, (p) => [0.05, 0, moving ? sin(p) * 0.06 : 0]),
    track(THREE, 'Neck', D, N, (p) => [0, -1.15 + (moving ? 0 : sin(p) * 0.25), 0]),
    track(THREE, 'LegL', D, N, () => [0, 0, 0.2]),
    track(THREE, 'LegR', D, N, () => [0, 0, -0.2]),
    armTrack(THREE, rig, 'L', D, N, (p, sw, s) => [sin(p) * 0.1, 0, (0.6 + sin(p * 2) * 0.1) * s]),
    armTrack(THREE, rig, 'R', D, N, (p, sw, s) => [-sin(p) * 0.1, 0, (0.6 + sin(p * 2 + 1) * 0.1) * s]),
  ];
  if (hover) tracks.push(track(THREE, 'Board', D, N, (p) => [sin(p) * 0.04, 0, sin(p * 2) * 0.03]));

}

function pasteConfig() {

  t.readOnly = false; t.value = ''; t.placeholder = 'Paste a config JSON here, then click outside the box';
  t.focus();
  t.addEventListener('blur', () => {
    try { const p = JSON.parse(t.value); cfg = toUniversal({ type: cfg.type, ...p }); rebuild(); }
    catch { t.readOnly = true; updateExport(); }
  }, { once: true });
}

// ---------------- stage controls
function renderClips() {
  const box = $('#clipBtns');
  const names = crowd ? ['Walk', 'Idle', 'Wave'] : hero.clipNames;
  const cur = crowd ? crowd.clip : hero.current?.getClip().name;
  box.replaceChildren(...names.map((n) => chipBtn(n, n === cur, () => {
    if (crowd) { crowd.clip = n; crowd.list.forEach(({ c }) => c.play(c.clipNames.includes(n) ? n : c.defaultClip)); }
    else hero.play(n);
    renderClips();
  })));
}
$('#speed').addEventListener('input', (e) => { speed = +e.target.value; $('#speedOut').textContent = speed.toFixed(2) + '×'; });
$('#spinBtn').addEventListener('click', (e) => { spin = !spin; e.target.setAttribute('aria-pressed', String(spin)); });

// crowd: every preset in its own style; click one to edit it
$('#crowdBtn').addEventListener('click', () => (crowd ? closeCrowd() : openCrowd()));
function openCrowd() {
  hero.root.visible = false;
  const all = [...Object.values(PRESETS.chibi), ...Object.values(PRESETS.blocky)];
  const cols = 10, gap = 1.3;
  crowd = { clip: 'Walk', list: all.map((p, i) => {
    const c = new Character(THREE, p);
    const r = Math.floor(i / cols), col = i % cols;
    c.root.position.set((col - (cols - 1) / 2) * gap, 0, (r - 2) * -gap * 1.3);
    c.mixer.setTime(Math.random());
    scene.add(c.root);
    return { p, c };
  }) };
  camera.position.set(0, 8, 15); controls.target.set(0, 0.6, 0);
  controls.maxDistance = 40; fitShadow(10); framedType = null;
  $('#crowdBtn').setAttribute('aria-pressed', 'true'); $('#crowdBtn').textContent = 'Back to editor';
  $('#hint').textContent = 'Chibi in front, blocky behind · click one to edit it';
  renderClips();
}
function closeCrowd() {
  crowd.list.forEach(({ c }) => { scene.remove(c.root); c.dispose(); });
  crowd = null; hero.root.visible = true; frame(cfg.type);
  $('#crowdBtn').setAttribute('aria-pressed', 'false'); $('#crowdBtn').textContent = 'Show all presets';
  $('#hint').textContent = 'Drag to orbit · scroll to zoom';
  renderClips();
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!crowd || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(crowd.list.map(({ c }) => c.root), true)[0];
  if (!hit) return;
  const found = crowd.list.find(({ c }) => { let o = hit.object; while (o) { if (o === c.root) return true; o = o.parent; } return false; });
  if (!found) return;
  closeCrowd(); load(found.p);
});

// ---------------- loop
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);
resize();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { speed = 0; $('#speed').value = 0; $('#speedOut').textContent = '0.00×'; }
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta() * speed;
  if (crowd) crowd.list.forEach(({ c }) => c.update(dt));
  else { hero.update(dt); if (spin) hero.root.rotation.y += dt * 0.7; }
  controls.update();
  renderer.render(scene, camera);
});
rebuild();

</script>
