# The whole stack on one machine:   docker compose up --build
# Then open http://localhost:16769    (change the port with WEB_PORT in .env)
#
# web     the built frontend, served by Caddy, which also forwards /api and /socket.io to the server
# server  the NestJS server: runs the office simulation at TICK_RATE and reports it at /api/world
# db      PostgreSQL, data kept in the "pgdata" volume
#
# The defaults below are for local development only. For anything shared, copy .env.example to .env
# and set real values.
name: office-sim

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      # Keep the plain HTTP development endpoint on this host only; LAN access goes through web-lan.
      - "127.0.0.1:${WEB_PORT:-16769}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # LAN edge is opt-in: start with `docker compose --profile lan up --build`.
  # By default it uses Caddy's internal CA (install that CA on each LAN client before browsing). With LAN_TLS=cloudflare it gets real Let's
  # Encrypt certificates for your own domain instead (DNS-01 through the Cloudflare API), and no client needs to install anything.
  web-lan:
    profiles: ["lan"]
    build:
      context: .
      dockerfile: docker/web-lan.Dockerfile
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-office.lan}"
      VOICE_SITE_ADDRESS: "${VOICE_SITE_ADDRESS:-voice.office.lan}"
      LAN_HTTPS_PORT: "${LAN_HTTPS_PORT:-443}" # (the port clients reach HTTPS on: the plain-HTTP page links to it)
      LAN_TLS: "${LAN_TLS:-internal}" # internal (Caddy's own CA) or cloudflare (Let's Encrypt): see docker/caddy-tls/
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}" # only for LAN_TLS=cloudflare: a token that can edit DNS in the one zone of the site's domain
      ACME_CA: "${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}" # the staging endpoint is for trying the setup (its certificates are not trusted)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${LAN_HTTP_PORT:-80}:80"
      - "${LAN_HTTPS_PORT:-443}:443"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Voice is opt-in: start with `docker compose --profile voice up --build`.
  # Do not expose a LiveKit listener merely because the ordinary gameplay stack is running.
  voice:
    profiles: ["voice"]
    image: livekit/livekit-server:v1.9.2
    command: >-
      --dev --bind 0.0.0.0
      --udp-port ${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50020}
      ${LIVEKIT_NODE_IP:+--node-ip ${LIVEKIT_NODE_IP}}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY when using the voice profile}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET when using the voice profile}"
    ports:
      # Room Service/signaling is reached by web-lan over the Docker network; do not expose it on the LAN.
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_INTERNAL_PORT:-7881}"
      - "${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50020}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50020}/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # so the records can be on the same PC (host.docker.internal is built in on Docker Desktop; this adds it on Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      TZ: "${TZ:-UTC}"
      GRACE_MS: "${GRACE_MS:-30000}"
      TICK_RATE: "${TICK_RATE:-20}"
      SLOT_COUNT: "${SLOT_COUNT:-40}"
      SIM_SPEED: "${SIM_SPEED:-1}"
      SIM_PAUSED: "${SIM_PAUSED:-false}"
      WORLD_SEED: "${WORLD_SEED:-}"
      PHYSICS: "${PHYSICS:-on}"
      VOICE_ENABLED: "${VOICE_ENABLED:-false}"
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://localhost:7880}"
      LIVEKIT_API_URL: "${LIVEKIT_API_URL:-http://voice:7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-change-this-server-only-secret}"
      VOICE_ROOM: "${VOICE_ROOM:-office}"
      VOICE_RANGE: "${VOICE_RANGE:-10}"
      TRUST_PROXY: "1" # Caddy is one hop in front: use the client address it reports
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      AUTH_LOGINS_PER_MINUTE: "${AUTH_LOGINS_PER_MINUTE:-}" # empty: 30 per address a minute; raise only to load-test from one PC (npm run bots)
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      # the company's employee records (read-only, imported into this database); empty: the staff list is not imported
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:-}"
      EMPLOYEE_IMPORT_MS: "${EMPLOYEE_IMPORT_MS:-}"
      ATTENDANCE_MS: "${ATTENDANCE_MS:-}"
      RESET_WORLD: "${RESET_WORLD:-false}"
      SAVE_INTERVAL_MS: "${SAVE_INTERVAL_MS:-10000}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-office}:${POSTGRES_PASSWORD:-office_dev_password}@db:5432/${POSTGRES_DB:-office}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-office}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-office_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-office}"
      TZ: "${TZ:-UTC}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
